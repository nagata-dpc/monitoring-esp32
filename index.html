<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Kesehatan ESP32 - Pink Edition</title>
    <style>
        :root {
            --pink-primary: #ec4899;
            --pink-light: #fbcfe8;
            --pink-bg: #fdf2f8;
            --pink-dark: #be185d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--pink-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 550px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.15);
            border: 2px solid var(--pink-light);
            padding: 30px;
        }

        .url-box {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--pink-light);
            border-radius: 12px;
            background-color: #fffafc;
            color: var(--pink-dark);
            font-family: monospace;
            font-size: 14px;
            margin-bottom: 25px;
            outline: none;
            transition: all 0.3s;
        }

        .url-box:focus {
            border-color: var(--pink-primary);
            box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.2);
        }

        .grid-form {
            display: grid;
            grid-template-columns: 80px 1fr auto;
            gap: 15px 10px;
            align-items: center;
            margin-bottom: 25px;
        }

        label {
            font-weight: 600;
            color: var(--pink-dark);
            font-size: 14px;
        }

        input[type="text"] {
            padding: 10px 12px;
            border: 2px solid var(--pink-light);
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            transition: border 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--pink-primary);
        }

        .sensor-display {
            padding: 10px 15px;
            background-color: #fff1f2;
            border: 2px solid var(--pink-light);
            border-radius: 10px;
            font-weight: bold;
            font-family: monospace;
            color: var(--pink-dark);
            font-size: 15px;
            min-height: 42px;
            display: flex;
            align-items: center;
        }

        .btn {
            background-color: var(--pink-primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(236, 72, 153, 0.2);
        }

        .btn:hover {
            background-color: var(--pink-dark);
            transform: translateY(-1px);
        }

        .btn-bluetooth {
            background-color: #6366f1;
            box-shadow: 0 4px 6px rgba(99, 102, 241, 0.2);
        }

        .btn-bluetooth:hover {
            background-color: #4f46e5;
        }

        .table-wrapper {
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--pink-light);
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 14px;
        }

        th {
            background-color: #fce7f3;
            color: var(--pink-dark);
            padding: 12px;
            font-weight: 700;
            border-bottom: 2px solid var(--pink-light);
        }

        td {
            padding: 12px;
            background-color: white;
            color: #4b5563;
            border-bottom: 1px solid #f3f4f6;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .placeholder-text {
            color: #d1d5db;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .actions-footer {
            display: flex;
            justify-content: flex-end;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <input type="text" id="esp-url" value="https://111.111.11.11" placeholder="https://..." class="url-box">

        <div class="grid-form">
            <label for="input-nama">Nama</label>
            <input type="text" id="input-nama" placeholder="Masukkan nama...">
            <button id="btn-bluetooth" class="btn btn-bluetooth">Connect Bluetooth</button>

            <label>HR</label>
            <div id="val-hr" class="sensor-display">-- bpm</div>
            <div></div>

            <label>Temp</label>
            <div id="val-temp" class="sensor-display">-- °C</div>
            <button id="btn-save" class="btn">Save</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="border-right: 1px solid var(--pink-light); width: 33.33%;">Nama</th>
                        <th style="border-right: 1px solid var(--pink-light); width: 33.33%;">HR</th>
                        <th style="width: 33.33%;">Body Temperature</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr class="placeholder-text">
                        <td style="border-right: 1px solid #f3f4f6;">. . . .</td>
                        <td style="border-right: 1px solid #f3f4f6;">. . . .</td>
                        <td>. . . .</td>
                    </tr>
                    <tr class="placeholder-text">
                        <td style="border-right: 1px solid #f3f4f6;">. . . .</td>
                        <td style="border-right: 1px solid #f3f4f6;">. . . .</td>
                        <td>. . . .</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="actions-footer">
            <button id="btn-download" class="btn">Download</button>
        </div>

    </div>

    <script>
        const btnSave = document.getElementById('btn-save');
        const btnDownload = document.getElementById('btn-download');
        const tableBody = document.getElementById('table-body');
        
        // Array untuk menyimpan data log secara internal agar mudah diunduh
        let savedData = [];
        let initialClear = true; 

        // Fungsi ketika tombol SAVE diklik
        btnSave.addEventListener('click', () => {
            const nama = document.getElementById('input-nama').value.trim() || "Tanpa Nama";
            const hr = document.getElementById('val-hr').innerText;
            const temp = document.getElementById('val-temp').innerText;

            if (initialClear) {
                tableBody.innerHTML = ''; 
                initialClear = false;
            }

            // Simpan data ke dalam array objek JavaScript
            savedData.push({ nama, hr, temp });

            // Tampilkan baris baru ke tabel HTML
            const newRow = document.createElement('tr');
            newRow.innerHTML = `
                <td style="border-right: 1px solid #f3f4f6; font-weight: 500;">${nama}</td>
                <td style="border-right: 1px solid #f3f4f6; font-family: monospace; color: var(--pink-dark); font-weight: 600;">${hr}</td>
                <td style="font-family: monospace; color: var(--pink-dark); font-weight: 600;">${temp}</td>
            `;
            tableBody.appendChild(newRow);
        });

        // Fungsi ketika tombol DOWNLOAD diklik
        btnDownload.addEventListener('click', () => {
            if (savedData.length === 0) {
                alert("Belum ada data yang disimpan! Silakan klik tombol 'Save' terlebih dahulu.");
                return;
            }

            // Membuat baris dokumen CSV (Header kolom)
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Nama,Heart Rate (HR),Body Temperature\n";

            // Memasukkan setiap baris data yang tersimpan
            savedData.forEach(row => {
                // Membersihkan koma jika user memasukkan nama yang mengandung koma agar struktur CSV tidak rusak
                const safeNama = row.nama.replace(/,/g, " "); 
                csvContent += `${safeNama},${row.hr},${row.temp}\n`;
            });

            // Logika browser untuk memicu unduhan file otomatis
            const encodedUri = encodeURI(csvContent);
            const downloadLink = document.createElement("a");
            downloadLink.setAttribute("href", encodedUri);
            
            // Nama file saat diunduh otomatis
            downloadLink.setAttribute("download", "log_monitoring_kesehatan.csv");
            document.body.appendChild(downloadLink);
            
            downloadLink.click(); // Klik tersembunyi
            document.body.removeChild(downloadLink); // Hapus elemen pembantu
        });

        // Simulasi penerimaan data Sensor ESP32 (Akan otomatis diperbarui tiap 3 detik untuk demo)
        setInterval(() => {
            const randomHR = Math.floor(Math.random() * (90 - 65 + 1)) + 65;
            const randomTemp = (Math.random() * (37.2 - 36.1) + 36.1).toFixed(1);
            
            document.getElementById('val-hr').innerText = randomHR + " bpm";
            document.getElementById('val-temp').innerText = randomTemp + " °C";
        }, 3000);
    </script>
</body>
</html>
